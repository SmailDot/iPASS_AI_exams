name: Verify local trial (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipas-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Validate content, rules, backups and private local server
        run: |
          npm run check
          npm test
      - name: Install test-only dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify every executable code question
        run: npm run test:code
      - name: Build and test actual browser interactions on localhost
        run: |
          mkdir -p test-output
          node scripts/serve.mjs > test-output/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/iPASS_AI_exams/ > /dev/null && break
            sleep 1
          done
          npm run test:browser
      - name: Package local trial (not a website deployment)
        run: python scripts/package-local.py
      - name: Upload local package and test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipas-local-trial-and-tests
          path: |
            release
            test-output
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate source and local server contracts on Windows
        run: |
          npm run check
          npm test
      - name: Exercise the actual Windows launcher
        shell: pwsh
        run: ./tests/windows-launch.ps1
      - name: Upload Windows test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipas-windows-local-tests
          path: test-output
# Intentionally no Pages permission, upload-pages-artifact or deployment job.
# Separately disable any GitHub-managed branch publishing in Settings > Pages.
