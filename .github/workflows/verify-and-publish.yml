name: Verify and publish
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Validate content, rules and backup contracts
        run: |
          npm run check
          npm test
      - name: Install test-only Python dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify every executable code question
        run: npm run test:code
      - name: Build and test actual browser interactions
        run: |
          mkdir -p test-output
          node scripts/serve.mjs > test-output/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/iPASS_AI_exams/ > /dev/null && break
            sleep 1
          done
          npm run test:browser
      - name: Upload build and test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipas-web-and-tests
          path: |
            dist
            test-output
      - name: Check whether Pages was enabled by the repository owner
        id: pages-check
        if: github.ref == 'refs/heads/mastar' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$kind" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled for Actions. Enable Settings > Pages > Source: GitHub Actions, then run this workflow again. No deployment was claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    if: needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
